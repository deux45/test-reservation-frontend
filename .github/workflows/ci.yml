# Continuous integration for the reservations web client.
#
# Actions are pinned by commit SHA rather than tag: tags are mutable, and
# repointing one is how the tj-actions/changed-files compromise spread. The
# trailing comment keeps the version readable and lets Dependabot upgrade both.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run lint:check
      - run: npm run format:check
      # Includes the generated src/lib/api/schema.d.ts, so a backend contract
      # change that this client has not regenerated breaks the build here.
      - run: npm run typecheck

  security:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run audit:signatures
      - run: npm run audit:vulns

  test:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      # vitest.config.ts pins TZ=UTC. Without it these pass locally and fail
      # here, which is the single most common failure in a booking app.
      - run: npm run test:cov

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        # NEXT_PUBLIC_* is baked into the browser bundle at build time, so it has
        # to be present here even though this artifact is never deployed.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # --------------------------------------------------------------------------
  # Playwright needs the full stack (API + PostgreSQL), so it clones the backend
  # and brings its compose up. That is slow and couples the two repositories, so
  # it does not run on every push: label a PR `e2e`, or dispatch it manually.
  # Locally it is just `npm run e2e` with the backend already running.
  # --------------------------------------------------------------------------
  e2e:
    name: Playwright (full stack)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/test-reservation-backend
          path: .api

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Start the API stack
        working-directory: .api
        run: |
          cp .env.example .env
          docker compose up -d --build
          docker compose exec -T api npm run migration:run
          docker compose exec -T api npm run seed

      # Browsers need their install script; --ignore-scripts blocked it earlier.
      - run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
