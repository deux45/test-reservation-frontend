# Release: bump the version, write the changelog, tag, and publish the image.
# Mirrors the API's release workflow so both repositories version identically.

name: Release

on:
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Version bump (leave empty to derive it from the commits)'
        required: false
        type: choice
        options: ['', patch, minor, major]
        default: ''
      dry-run:
        description: 'Preview the version and changelog without committing'
        required: false
        type: boolean
        default: false
      api-url:
        description: 'Public API URL baked into the image'
        required: true
        type: string
        default: 'https://api.reservations.example.com'

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io

jobs:
  release:
    name: Version, changelog and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify the tree is releasable
        run: |
          npm run lint:check
          npm run typecheck
          npm run test

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preview release (dry run)
        if: inputs.dry-run
        run: npm run release -- --dry-run ${{ inputs.release-as && format('--release-as {0}', inputs.release-as) || '' }}

      - name: Bump version, write CHANGELOG.md and tag
        if: ${{ !inputs.dry-run }}
        run: npm run release -- ${{ inputs.release-as && format('--release-as {0}', inputs.release-as) || '' }}

      - name: Read the resulting version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push the release commit and tag
        if: ${{ !inputs.dry-run }}
        run: git push --follow-tags origin ${{ github.ref_name }}

      - name: Extract this version's changelog section
        if: ${{ !inputs.dry-run }}
        run: |
          node -e "
            const md = require('fs').readFileSync('CHANGELOG.md', 'utf8');
            const sections = md.split(/^##\s+/m).filter(Boolean);
            require('fs').writeFileSync('RELEASE_NOTES.md', '## ' + sections[1]);
          "

      - name: Create the GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          --title "v${{ steps.version.outputs.version }}"
          --notes-file RELEASE_NOTES.md

  publish-image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !inputs.dry-run }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # The API URL is compiled into the browser bundle, so the image is
          # environment-specific. That is why it is an input to this workflow
          # and not a runtime variable in docker-compose.prod.yml.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api-url }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
