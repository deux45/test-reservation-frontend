name: reservations-web-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - '3001:3001'
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      # Tests and their config are excluded from the image by .dockerignore --
      # correctly, a production image has no business shipping them. They are
      # bind-mounted here instead so `make test` can run inside the container
      # without putting them back in the build context.
      - ./test:/app/test
      - ./vitest.config.ts:/app/vitest.config.ts:ro
      - /app/node_modules
      - /app/.next

networks:
  default:
    # Created by the API repo's compose. Start that one first:
    #   cd ../test-reservation-backend && docker compose up -d
    name: reservations-net
    external: true
